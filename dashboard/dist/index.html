<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SecurityLab — стенд проверки</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки светлого фона.
      try {
        var t = localStorage.getItem('slb.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { /* без localStorage остаёмся в светлой теме */ }
    </script>
    <script type="module" crossorigin src="./assets/index-D0rzU5jE.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CD-_M-7I.css">
    <!-- Штырёк стиля: знак и надпись в шапке приводятся к виду вкладки (favicon.svg):
         кремовая плитка, серифная зелёная S, красный квадратик, серифная надпись.
         Исходники (src/App.tsx, src/index.css) уже переведены на этот стиль — после
         следующей пересборки dist этот блок станет не нужен (vite перезапишет файл). -->
    <style id="slb-wordmark-shim">
      header a[aria-label="SecurityLab — на главную"] > span:first-child {
        background: #f1eee5 !important;
        border-radius: 5px !important;
        position: relative;
        font-family: Georgia, "Times New Roman", serif !important;
        font-size: 21px !important;
        font-weight: 700 !important;
        line-height: 1 !important;
        color: #1e4d38 !important;
      }
      header a[aria-label="SecurityLab — на главную"] > span:first-child::after {
        content: "";
        position: absolute;
        right: 6px;
        bottom: 8px;
        width: 5px;
        height: 5px;
        background: #b8481f;
      }
      header a[aria-label="SecurityLab — на главную"] > span:last-child > span:first-child {
        font-family: Georgia, "Times New Roman", serif !important;
        font-size: 17px !important;
        font-weight: 700 !important;
        letter-spacing: -0.01em !important;
        color: #1e4d38 !important;
      }
      header a[aria-label="SecurityLab — на главную"] > span:last-child > span:first-child > span {
        color: #b8481f !important;
      }
      header a[aria-label="SecurityLab — на главную"] > span:last-child > span:last-child {
        font-family: Georgia, "Times New Roman", serif !important;
        font-style: italic !important;
        font-size: 10.5px !important;
        font-weight: 400 !important;
        letter-spacing: 0.05em !important;
        text-transform: none !important;
        color: #1e4d38 !important;
        opacity: 0.72;
      }
      .dark header a[aria-label="SecurityLab — на главную"] > span:last-child > span:first-child,
      .dark header a[aria-label="SecurityLab — на главную"] > span:last-child > span:last-child {
        color: #9fd9b7 !important;
      }
      .dark header a[aria-label="SecurityLab — на главную"] > span:last-child > span:first-child > span {
        color: #e2763f !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
