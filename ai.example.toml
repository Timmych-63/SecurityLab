# Copy to ai.local.toml and select explicitly via SECURITYLAB_AI_CONFIG.
[ai]
model = "qwen3.5:2b"
# model_digest must equal the "digest" field that /api/tags reports for the
# selected model (exact string match in hermes_worker.py). Do not substitute
# sha256sum of the manifest file: it can differ from the digest reported by
# the API (observed with qwen3.5:4b).
model_digest = "0689d44085e06d165161a8a9a1731344278cfb5aade63a3c3dbdb48ab54b130a"
server_url = "http://model:11434"
network = "securitylab-ai-private"
context_tokens = 64000
max_output_tokens = 2048
timeout_seconds = 1200
# Optional repetition-suppression knobs (Ollama applies them on /v1/chat/completions).
# Recommended for qwen3.5:2b against degenerate repeated output; omit the keys to
# keep server defaults. Set them in ai.local.toml, not here:
# frequency_penalty = 0.4
# presence_penalty = 0.2
